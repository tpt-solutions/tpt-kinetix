<!doctype html>
<meta charset="utf-8">
<title>tpt-kinetix packager browser test</title>
<video id="v" muted playsinline width="320" height="240"></video>
<script src="/hls.js"></script>
<script src="/dash.js"></script>
<script>
  // Plays a stream with a real MSE client and reports progress to the harness.
  const q = new URLSearchParams(location.search);
  const kind = q.get("kind");
  const url = q.get("url");
  const want = Number(q.get("seconds") || 5);
  const v = document.getElementById("v");
  const errors = [];
  // What the player did, for diagnosing a stall: key and fragment events.
  const notes = [];
  let done = false;

  // WebVTT cues that hls.js has put on the video's text tracks (subtitle runs only).
  function subtitleCues() {
    const cues = [];
    for (const t of v.textTracks || []) {
      for (const c of t.cues || []) cues.push(c.text);
    }
    return cues;
  }

  function report(extra) {
    if (done) return;
    done = true;
    const subs = subtitleCues();
    const audioTracks = v.audioTracks ? v.audioTracks.length : null;
    // For LL-HLS the page object stashes the player first (`window.__hls`);
    // latency is live edge minus playhead at report time.
    const hls = window.__hls;
    const liveEdge = hls && hls.liveSyncPosition !== null && hls.liveSyncPosition !== undefined
      ? hls.liveSyncPosition : null;
    fetch("/result", {
      method: "POST",
      body: JSON.stringify({
        kind, url, errors,
        currentTime: v.currentTime,
        duration: v.duration,
        videoWidth: v.videoWidth,
        videoHeight: v.videoHeight,
        readyState: v.readyState,
        buffered: v.buffered.length ? [v.buffered.start(0), v.buffered.end(v.buffered.length - 1)] : null,
        audioTracks,
        decodedFrames: v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality().totalVideoFrames : null,
        droppedFrames: v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality().droppedVideoFrames : null,
        latency: liveEdge !== null ? Math.max(0, liveEdge - v.currentTime) : null,
        liveSyncPosition: liveEdge,
        subtitleCues: subs.length,
        subtitleText: subs.slice(0, 3),
        notes: notes.slice(0, 40),
        ...extra,
      }),
    });
  }

  v.addEventListener("error", () => errors.push("video element error " + (v.error && v.error.message)));
  // Progress is measured from where playback first started: a live stream begins
  // near the live edge, not at 0.
  let origin = null;
  v.addEventListener("timeupdate", () => {
    if (origin === null && v.currentTime > 0) origin = v.currentTime;
    if (origin !== null && v.currentTime - origin >= want) report({ ok: true, origin });
  });
  setTimeout(() => report({ ok: false, timeout: true }), 40000);

  if (kind === "hls" || kind === "hlssubs" || kind === "hlsenc") {
    if (!Hls.isSupported()) { errors.push("Hls.isSupported() is false"); report({ ok: false }); }
    else {
      // Low-latency mode: small back-buffer and `liveSyncDurationCount` of one
      // part-worth, so `hls.liveSyncPosition` tracks the live edge the
      // packager advertises. The harness records `latency` (live edge minus
      // playhead) alongside the usual progress fields.
      const config = { lowLatencyMode: true, backBufferLength: 30, liveSyncDurationCount: 1 };
      if (kind === "hlsenc") {
        // CENC (ClearKey) HLS: the EXT-X-KEY names the ClearKey system, and the
        // license is the key.json the packager serves next to the playlist.
        config.emeEnabled = true;
        config.drmSystems = {
          "org.w3.clearkey": { licenseUrl: new URL("key.json", url).href },
        };
      }
      const hls = new Hls(config);
      window.__hls = hls;
      // A non-fatal bufferStalledError is expected when a live playhead sits at the
      // live edge on a slow runner (hls.js recovers by itself); progress is still
      // required by the harness, so only record other errors.
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal && d.details === "bufferStalledError") { console.warn("hls: non-fatal stall"); return; }
        errors.push(`${d.type}/${d.details}${d.fatal ? " (fatal)" : ""}`);
      });
      if (kind === "hlssubs") {
        // Turn on the subtitle group the master playlist's DEFAULT=YES rendition names.
        hls.subtitleDisplay = true;
        hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, () => {
          if (hls.subtitleTracks.length > 0) hls.subtitleTrack = 0;
        });
      }
      for (const ev of ["keyLoaded", "keyLoading", "fragLoading", "fragLoaded", "manifestParsed", "levelLoaded"]) {
        const name = Hls.Events[ev.replace(/[A-Z]/g, (c) => "_" + c).toUpperCase()];
        if (name) hls.on(name, (_, d) => notes.push(ev + " " + JSON.stringify(d && (d.frag ? { sn: d.frag.sn } : d.key ? { keyId: d.key.keyId } : {})).slice(0, 120)));
      }
      hls.loadSource(url);
      hls.attachMedia(v);
      v.play().catch((e) => errors.push("play: " + e));
    }
  } else {
    const p = dashjs.MediaPlayer().create();
    p.on("error", (e) => errors.push("dash error " + JSON.stringify(e.error || e).slice(0, 200)));
    // CENC (ClearKey): the key ID and key come as hex, and ClearKey wants base64url.
    const kid = q.get("kid");
    const key = q.get("key");
    if (kid && key) {
      const b64url = (hex) => {
        let s = "";
        for (let i = 0; i < hex.length; i += 2) s += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
        return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      };
      p.setProtectionData({ "org.w3.clearkey": { clearkeys: { [b64url(kid)]: b64url(key) } } });
    }
    p.initialize(v, url, true);
  }
</script>
