name: template

on:
  push:
    paths:
      - "templates/**"
      - ".github/workflows/template.yml"
  pull_request:
    paths:
      - "templates/**"
      - ".github/workflows/template.yml"

jobs:
  scaffold-smoke:
    name: codec-crate template smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-generate
        run: cargo install cargo-generate --locked
      - name: Generate a sample codec crate
        run: |
          # The generated crate inherits workspace.package fields and depends on
          # ../tpt-kinetix-core, so it must live at the workspace root (throwaway CI checkout).
          cargo generate --path templates/codec-crate \
            --name tpt-kinetix-samplecodec \
            --define codec_name=samplecodec \
            --define codec_cap=Samplecodec \
            --define codec_title="Sample Codec" \
            --define codec_kind=video \
            --destination .
      - name: Register the generated crate as a workspace member
        run: sed -i '0,/^members = \[/s//members = [\n  "tpt-kinetix-samplecodec",/' Cargo.toml
      - name: Build the generated crate against the workspace
        run: cargo build -p tpt-kinetix-samplecodec
      - name: Test the generated crate
        run: cargo test -p tpt-kinetix-samplecodec
