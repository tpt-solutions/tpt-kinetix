name: CI

on:
  push:
    branches: ["master", "claude/**", "feature/**"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --lib --bins --tests

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  publish-safe:
    name: No encumbered crates in published set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 tools/check_no_encumbered.py

  docs:
    name: Docs (cargo doc)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  wasm:
    name: WASM (demux + core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build demux + core for wasm32
        run: cargo build -p tpt-kinetix-core -p tpt-kinetix-demux --target wasm32-unknown-unknown

  msrv:
    name: MSRV (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the version pinned in rust-toolchain.toml (must match
      # workspace.package.rust-version). This job fails if the workspace no
      # longer builds on the declared MSRV.
      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          MSRV="$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([0-9.]+)".*/\1/')"
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"
          echo "Detected MSRV: $MSRV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  deny:
    name: Deny (licenses / advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - run: cargo deny check

  fuzz-check:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Check fuzz targets compile (demux)
        run: cargo fuzz build fuzz_mp4_box
        working-directory: tpt-kinetix-demux
      - name: Check fuzz targets compile (demux mkv)
        run: cargo fuzz build fuzz_mkv_ebml
        working-directory: tpt-kinetix-demux
      - name: Check fuzz targets compile (av1)
        run: |
          cargo fuzz build fuzz_obu_parse
          cargo fuzz build fuzz_av1_frame
        working-directory: tpt-kinetix-av1
      - name: Check fuzz targets compile (h264)
        run: cargo fuzz build fuzz_h264_nal
        working-directory: out-kinetix-h264
      - name: Check fuzz targets compile (vp9)
        run: cargo fuzz build fuzz_vp9_frame
        working-directory: tpt-kinetix-vp9
      - name: Check fuzz targets compile (stream)
        run: |
          cargo fuzz build fuzz_rtmp_chunk
          cargo fuzz build fuzz_rtmp_amf
          cargo fuzz build fuzz_rtmp_flv
          cargo fuzz build fuzz_hls_playlist
        working-directory: tpt-kinetix-stream

  conformance:
    name: Conformance (ffmpeg-gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run ffmpeg-gated conformance tests
        # These are the tests that actually exercise decode-vs-ffmpeg/dav1d
        # assertions (previously silently skipped when ffmpeg was absent).
        run: |
          cargo nextest run \
            -p out-kinetix-h264 \
            -p tpt-kinetix-av1 \
            -p tpt-kinetix-stream \
            -p tpt-kinetix-test-utils
      - name: Print decoder capabilities
        run: cargo run -p tpt-kinetix-test-utils --example codec_status
      # Non-blocking: the experimental `lean` and `vision` decoders are
      # (intentionally) not pixel-exact, so strict mode fails on them. The
      # published codecs are gated by the conformance report below.
      - name: Assert pixel-exact (strict, non-blocking)
        continue-on-error: true
        run: cargo run -p tpt-kinetix-test-utils --example codec_status -- --strict
      - name: Fetch AV1 FATE samples
        run: bash tools/fetch-av1-fate.sh
      - name: Generate conformance report
        env:
          KINETIX_AV1_FATE_DIR: fixtures/av1-fate
        run: cargo run --release -p tpt-kinetix-test-utils --example conformance_report -- --out conformance-out
      - name: Upload conformance report
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: conformance-out

  wasm-package-test:
    name: WASM package byte-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
      - name: Build the WASM packager and compare its output to native
        # The WASM packager must produce byte-identical HLS/DASH to the native
        # one over async range reads; a divergence here is a packaging bug that
        # only shows up in browsers.
        run: bash tools/wasm-package-test.sh

  edge-worker-test:
    name: Edge Worker handler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
      - name: Run the Worker request handler test
        # The Worker handler must serve the same segment bytes as the native
        # server, over a fetch-like callback.
        run: bash tools/edge-worker-test.sh

  browser-package-test:
    name: Browser playback (hls.js / dash.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the Chrome-for-Testing binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/tpt-chrome
          key: chrome-${{ runner.os }}-${{ hashFiles('tools/fetch-chrome.sh') }}
      - name: Fetch Chrome (headless)
        id: chrome
        run: echo "path=$(bash tools/fetch-chrome.sh)" >> "$GITHUB_OUTPUT"
      - name: Run the hls.js / dash.js playback tests
        # Real players in real Chrome: proves the packaged manifests and
        # segments are actually playable, not just well-formed.
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: bash tools/browser-package-test.sh

  live-browser-test:
    name: Live playback (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the Chrome-for-Testing binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/tpt-chrome
          key: chrome-${{ runner.os }}-${{ hashFiles('tools/fetch-chrome.sh') }}
      - name: Fetch Chrome (headless)
        id: chrome
        run: echo "path=$(bash tools/fetch-chrome.sh)" >> "$GITHUB_OUTPUT"
      - name: Run the live (WebM ingest -> fMP4 HLS) browser test
        # A publisher sends WebM over HTTP and a real player in Chrome plays the
        # live fMP4 HLS, including the low-latency parts.
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: bash tools/live-browser-test.sh