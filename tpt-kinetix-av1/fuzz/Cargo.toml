[package]
name = "tpt-kinetix-av1-fuzz"
version = "0.0.1"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[workspace.dependencies]
nom = "7.1"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"

[dependencies]
libfuzzer-sys = "0.4"
tpt-kinetix-av1 = { path = ".." }

[[bin]]
name = "fuzz_obu_parse"
path = "fuzz_targets/fuzz_obu_parse.rs"
test = false
doc = false
