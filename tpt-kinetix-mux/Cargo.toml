[package]
name = "tpt-kinetix-mux"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Container muxers (MP4/ISO-BMFF) for the TPT Kinetix media processing engine"
keywords = ["mp4", "mux", "iso-bmff", "video", "muxer"]
categories = ["multimedia", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/tpt-kinetix-mux"

[dependencies]
thiserror = { workspace = true }
tpt-kinetix-core = { workspace = true }
# CENC (ISO/IEC 23001-7) AES-128 counter mode for protected fragments.
aes = "0.9"
ctr = "0.10"

[dev-dependencies]
tpt-kinetix-demux = { path = "../tpt-kinetix-demux" }
criterion = { workspace = true }
proptest = "1.5"

[[bench]]
name = "mp4_mux"
harness = false
