[package]
name = "tpt-kinetix-demux-fuzz"
version = "0.0.1"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tpt-kinetix-demux = { path = ".." }

[[bin]]
name = "fuzz_mp4_box"
path = "fuzz_targets/fuzz_mp4_box.rs"
test = false
doc = false

[[bin]]
name = "fuzz_mkv_ebml"
path = "fuzz_targets/fuzz_mkv_ebml.rs"
test = false
doc = false

[workspace]

[workspace.dependencies]
# Mirror the main workspace so `workspace = true` inheritance resolves to the
# pinned versions instead of `*`. Without this, the fuzz crate's standalone
# workspace pulls nom 8.x whose `count`/`be_u32` return `impl Parser` (not
# `impl FnMut`), breaking the `parser(input)` call convention used by demux.
nom = "7.1"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
debug = 1
opt-level = 3
