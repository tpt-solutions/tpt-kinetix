[package]
name = "tpt-kinetix-demux"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Container demuxers for the TPT Kinetix media processing engine"
keywords = ["mp4", "demux", "iso-bmff", "video", "parser"]
categories = ["multimedia", "parser-implementations"]
readme = "README.md"
documentation = "https://docs.rs/tpt-kinetix-demux"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nom = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tpt-kinetix-core = { workspace = true }
byteorder = "1.5"
wasm-bindgen = { version = "0.2", optional = true }
serde_json = { workspace = true, optional = true }
# HTTP/HTTPS range-request source (`http` feature); already in the workspace graph via tpt-kinetix-kg.
ureq = { version = "3.4", optional = true }

[features]
wasm = ["dep:wasm-bindgen", "dep:serde_json"]
http = ["dep:ureq"]

[dev-dependencies]
proptest = "1.5"
criterion = { workspace = true }
tpt-kinetix-mux = { workspace = true }

[[bench]]
name = "container_demux"
harness = false
