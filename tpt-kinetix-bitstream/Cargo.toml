[package]
name = "tpt-kinetix-bitstream"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared bitstream primitives (BitReader, rANS) for the TPT Kinetix original codecs (lean/vision/realtime)"
keywords = ["tpt-kinetix", "bitstream", "rans", "codec", "multimedia"]
categories = ["multimedia::video"]
readme = "README.md"
documentation = "https://docs.rs/tpt-kinetix-bitstream"

[dependencies]
tpt-kinetix-core = { workspace = true }

[lib]
path = "src/lib.rs"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "bitstream_ops"
harness = false
