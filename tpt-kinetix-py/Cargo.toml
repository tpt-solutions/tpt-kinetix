[package]
name = "tpt-kinetix-py"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for the TPT Kinetix container tools (probe, remux, package)"
publish = false

[lib]
# Built as a Python extension by maturin (see pyproject.toml).
name = "_tpt_kinetix"
crate-type = ["cdylib", "rlib"]
# No Rust tests here (the Python tests run against the installed wheel). A test
# harness would link libpython, which fails on runners without a Python framework.
test = false
doctest = false

[features]
# On by default so plain `cargo build --workspace` links the cdylib without libpython
# (macOS fails to link it otherwise). maturin enables it too, so this changes nothing there.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[build-dependencies]
# Used by build.rs to emit the macOS dynamic_lookup link arg for the extension module.
pyo3-build-config = "0.30"

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py39"] }
tpt-kinetix-ops = { workspace = true }
