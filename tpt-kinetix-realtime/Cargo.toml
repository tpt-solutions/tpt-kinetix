[package]
name = "tpt-kinetix-realtime"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Realtime: an original low-latency, loss-resilient video codec for the TPT Kinetix media processing engine"
keywords = ["tpt-kinetix", "realtime", "codec", "multimedia", "low-latency"]
categories = ["multimedia::video"]
readme = "README.md"
documentation = "https://docs.rs/tpt-kinetix-realtime"

[dependencies]
tpt-kinetix-core = { workspace = true }
tpt-kinetix-bitstream = { workspace = true }
thiserror = "2"
nom = "8"

# [dev-dependencies] temporarily disabled to run unit tests while the
# test-utils -> h264 chain is broken in this working tree.
# tpt-kinetix-test-utils = { path = "../tpt-kinetix-test-utils" }
criterion = { workspace = true }

[[bench]]
name = "realtime_codec"
harness = false

[lib]
path = "src/lib.rs"
