[package]
name = "tpt-kinetix-h264-fuzz"
version = "0.0.1"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[workspace.dependencies]
nom = "7.1"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"

[dependencies]
libfuzzer-sys = "0.4"
tpt-kinetix-h264 = { path = ".." }
tpt-kinetix-core = { path = "../../tpt-kinetix-core" }

[[bin]]
name = "fuzz_h264_nal"
path = "fuzz_targets/fuzz_h264_nal.rs"
test = false
doc = false
