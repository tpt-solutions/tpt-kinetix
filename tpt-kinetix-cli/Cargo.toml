[package]
name = "tpt-kinetix-cli"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface for the TPT Kinetix media processing engine"
keywords = ["ffmpeg", "video", "transcode", "cli", "media"]
categories = ["multimedia", "command-line-utilities"]
readme = "README.md"
documentation = "https://docs.rs/tpt-kinetix-cli"

[[bin]]
name = "tpt-kinetix"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# clap is CLI-only; not shared across library crates
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
tpt-kinetix-core = { workspace = true }
tpt-kinetix-demux = { workspace = true, features = ["http"] }
tpt-kinetix-mux = { workspace = true }
tpt-kinetix-package = { workspace = true }
tpt-kinetix-vp9 = { workspace = true, optional = true }
tpt-kinetix-av1 = { workspace = true }
tpt-kinetix-vision = { workspace = true }
tpt-kinetix-bitstream = { workspace = true }
tpt-kinetix-pipeline = { workspace = true, default-features = false }
tpt-kinetix-stream = { workspace = true }

[features]
default = ["codec-vp9"]
codec-vp9 = ["dep:tpt-kinetix-vp9", "tpt-kinetix-pipeline/codec-vp9"]
# WHIP (WebRTC) ingest in `live`: browsers and OBS publish VP9 + Opus over WebRTC.
whip = ["tpt-kinetix-stream/whip"]
# TLS for `live`: HTTPS / `wss://` on the HTTP port and RTMPS (`--tls-cert`, `--tls-key`).
tls = ["tpt-kinetix-stream/rtmps"]
