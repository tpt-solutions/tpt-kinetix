[package]
name = "tpt-kinetix-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface for the TPT Kinetix media processing engine"
keywords = ["ffmpeg", "video", "transcode", "cli", "media"]
categories = ["multimedia", "command-line-utilities"]
readme = "README.md"
documentation = "https://docs.rs/tpt-kinetix-cli"

[[bin]]
name = "tpt-kinetix"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# clap is CLI-only; not shared across library crates
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
tpt-kinetix-core = { workspace = true }
tpt-kinetix-demux = { workspace = true }
tpt-kinetix-h264 = { workspace = true, optional = true }
tpt-kinetix-av1 = { workspace = true }
tpt-kinetix-aac = { workspace = true, optional = true }
tpt-kinetix-vision = { workspace = true }
tpt-kinetix-bitstream = { workspace = true }
tpt-kinetix-pipeline = { workspace = true, default-features = false }
tpt-kinetix-stream = { workspace = true }

[features]
default = ["codec-h264", "codec-aac"]
# H.264 and AAC are patent-encumbered (see PATENTS.md). Build with
# `--no-default-features` for a royalty-free-only CLI.
codec-h264 = ["dep:tpt-kinetix-h264", "tpt-kinetix-pipeline/codec-h264"]
codec-aac = ["dep:tpt-kinetix-aac", "tpt-kinetix-stream/codec-aac"]
