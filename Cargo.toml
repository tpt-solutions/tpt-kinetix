[workspace]
resolver = "2"
members = [
  "tpt-kinetix-core",
  "tpt-kinetix-demux",
  "out-kinetix-h264",
  "tpt-kinetix-av1",
  "tpt-kinetix-vp9",
  "tpt-kinetix-kg",
  "tpt-kinetix-lean",
  "tpt-kinetix-lossless",
  "tpt-kinetix-bitstream",
  "tpt-kinetix-realtime",
  "tpt-kinetix-screen",
  "tpt-kinetix-vision",
  "tpt-kinetix-face",
  "tpt-kinetix-volumetric",
  "tpt-kinetix-mux",
  "tpt-kinetix-package",
  "tpt-kinetix-pipeline",
  "tpt-kinetix-stream",
  "tpt-kinetix-cli",
  "tpt-kinetix-test-utils",
]
exclude = ["tpt-kinetix-demux/fuzz", "tpt-kinetix-av1/fuzz", "tpt-kinetix-vp9/fuzz", "out-kinetix-h264/fuzz", "tpt-kinetix-stream/fuzz", "tpt-kinetix-lean/fuzz", "tpt-kinetix-lossless/fuzz", "tpt-kinetix-volumetric/fuzz", "tpt-kinetix-vision/fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-kinetix"

[workspace.dependencies]
# Parallelism
rayon = "1.10"

# Parsing
nom = "8.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# Channels
crossbeam-channel = "0.5"

# Internal crates (path for local dev; version required for crates.io publish)
tpt-kinetix-core = { path = "tpt-kinetix-core", version = "0.1.1" }
tpt-kinetix-demux = { path = "tpt-kinetix-demux", version = "0.1.1" }
out-kinetix-h264 = { path = "out-kinetix-h264", version = "0.1.1" }
tpt-kinetix-av1 = { path = "tpt-kinetix-av1", version = "0.1.1" }
tpt-kinetix-vp9 = { path = "tpt-kinetix-vp9", version = "0.1.1" }
tpt-kinetix-lean = { path = "tpt-kinetix-lean", version = "0.1.1" }
tpt-kinetix-bitstream = { path = "tpt-kinetix-bitstream", version = "0.1.1" }
tpt-kinetix-realtime = { path = "tpt-kinetix-realtime", version = "0.1.1" }
tpt-kinetix-screen = { path = "tpt-kinetix-screen", version = "0.1.1" }
tpt-kinetix-vision = { path = "tpt-kinetix-vision", version = "0.1.1" }
tpt-kinetix-face = { path = "tpt-kinetix-face", version = "0.1.1" }
tpt-kinetix-volumetric = { path = "tpt-kinetix-volumetric", version = "0.1.1" }
tpt-kinetix-lossless = { path = "tpt-kinetix-lossless", version = "0.1.1" }
tpt-kinetix-mux = { path = "tpt-kinetix-mux", version = "0.1.1" }
tpt-kinetix-package = { path = "tpt-kinetix-package", version = "0.1.1" }
tpt-kinetix-pipeline = { path = "tpt-kinetix-pipeline", version = "0.1.1", default-features = false }
tpt-kinetix-stream = { path = "tpt-kinetix-stream", version = "0.1.1", default-features = false }

[profile.release]
# Phase 3b item 1 of todo-perf.md. The workspace shipped with no release profile
# at all, i.e. Cargo's defaults: `opt-level = 3`, `codegen-units = 16`, no LTO.
# For a decoder that is mostly cross-crate inlining (coefficient tables,
# transform kernels, bit readers) the defaults leave real work on the table, and
# the same measurement session showed hand-written AVX2 losing to what LLVM
# already emits - so whole-program codegen is the higher-leverage lever.
#
# `lto = "fat"` + `codegen-units = 1` is the standard pairing: LTO needs
# cross-unit visibility and a single CGU is what makes "fat" practical.
# `panic = unwind` is left at the default on purpose - every crate here is a
# library, and `panic = "abort"` would break downstream `catch_unwind` users.
#
# Cost: release builds of this workspace (19 crates, incl. rav1e) go from
# roughly a minute to several minutes. `cargo bench` uses the `bench` profile,
# which inherits `release`, so the published benchmarks measure this too.
lto = "fat"
codegen-units = 1

[profile.bench]
# Explicit so a future edit to `[profile.release]` cannot silently move the
# benchmark numbers. `bench` inherits `release` by default; stating the keys
# here keeps that inheritance explicit rather than accidental.
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.test]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.rav1e]
opt-level = 3

[profile.dev.package.tree-sitter]
opt-level = 3

# TEMPORARY diagnostic override (session #31, todo-h264.md): works around a
# reproducible lld-link "undefined symbol: anon.*" cross-CGU failure when
# linking the out-kinetix-h264 lib-test binary on this machine. Remove once
# the lld-link issue is resolved or the lockstep test lands elsewhere.
[profile.dev.package.out-kinetix-h264]
codegen-units = 1

# Release codegen plus line tables, for `tpt-kinetix-av1`'s `prof_sample` example
# (an in-process sampling profiler; `samply`/ETW need an elevated shell here).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
