[workspace]
resolver = "2"
members = [
  "tpt-kinetix-core",
  "tpt-kinetix-demux",
  "tpt-kinetix-h264",
  "tpt-kinetix-av1",
  "tpt-kinetix-aac",
  "tpt-kinetix-kg",
  "tpt-kinetix-lean",
  "tpt-kinetix-lossless",
  "tpt-kinetix-bitstream",
  "tpt-kinetix-realtime",
  "tpt-kinetix-screen",
  "tpt-kinetix-vision",
  "tpt-kinetix-face",
  "tpt-kinetix-volumetric",
  "tpt-kinetix-mux",
  "tpt-kinetix-pipeline",
  "tpt-kinetix-stream",
  "tpt-kinetix-cli",
  "tpt-kinetix-test-utils",
]
exclude = ["tpt-kinetix-demux/fuzz", "tpt-kinetix-av1/fuzz", "tpt-kinetix-h264/fuzz", "tpt-kinetix-stream/fuzz", "tpt-kinetix-lean/fuzz", "tpt-kinetix-lossless/fuzz", "tpt-kinetix-volumetric/fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-kinetix"

[workspace.dependencies]
# Parallelism
rayon = "1.10"

# Parsing
nom = "8.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# Channels
crossbeam-channel = "0.5"

# AAC decode (wraps symphonia's pure-Rust AAC-LC decoder)
symphonia-codec-aac = "0.6"

# Internal crates (path for local dev; version required for crates.io publish)
tpt-kinetix-core = { path = "tpt-kinetix-core", version = "0.1.0" }
tpt-kinetix-demux = { path = "tpt-kinetix-demux", version = "0.1.0" }
tpt-kinetix-h264 = { path = "tpt-kinetix-h264", version = "0.1.0" }
tpt-kinetix-av1 = { path = "tpt-kinetix-av1", version = "0.1.0" }
tpt-kinetix-aac = { path = "tpt-kinetix-aac", version = "0.1.0" }
tpt-kinetix-lean = { path = "tpt-kinetix-lean", version = "0.1.0" }
tpt-kinetix-bitstream = { path = "tpt-kinetix-bitstream", version = "0.1.0" }
tpt-kinetix-realtime = { path = "tpt-kinetix-realtime", version = "0.1.0" }
tpt-kinetix-screen = { path = "tpt-kinetix-screen", version = "0.1.0" }
tpt-kinetix-vision = { path = "tpt-kinetix-vision", version = "0.1.0" }
tpt-kinetix-face = { path = "tpt-kinetix-face", version = "0.1.0" }
tpt-kinetix-volumetric = { path = "tpt-kinetix-volumetric", version = "0.1.0" }
tpt-kinetix-lossless = { path = "tpt-kinetix-lossless", version = "0.1.0" }
tpt-kinetix-mux = { path = "tpt-kinetix-mux", version = "0.1.0" }
tpt-kinetix-pipeline = { path = "tpt-kinetix-pipeline", version = "0.1.0" }
tpt-kinetix-stream = { path = "tpt-kinetix-stream", version = "0.1.0" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.test]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.rav1e]
opt-level = 3

[profile.dev.package.tree-sitter]
opt-level = 3
