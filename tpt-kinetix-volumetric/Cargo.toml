[package]
name = "tpt-kinetix-volumetric"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Volumetric / point-cloud codec for AR-VR content in the TPT Kinetix media processing engine"
keywords = ["tpt-kinetix", "volumetric", "point-cloud", "codec", "multimedia"]
categories = ["multimedia::video"]
readme = "README.md"
documentation = "https://docs.rs/tpt-kinetix-volumetric"

[dependencies]
tpt-kinetix-core = { workspace = true }
tpt-kinetix-bitstream = { workspace = true }
thiserror = "2"
nom = "8"

[dev-dependencies]
tpt-kinetix-test-utils = { path = "../tpt-kinetix-test-utils" }
criterion = { workspace = true }

[[bench]]
name = "volumetric_codec"
harness = false

[lib]
path = "src/lib.rs"
