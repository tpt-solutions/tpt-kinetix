[package]
name = "tpt-kinetix-volumetric"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Volumetric / point-cloud codec for AR-VR content in the TPT Kinetix media processing engine"
keywords = ["tpt-kinetix", "volumetric", "point-cloud", "codec", "multimedia"]
categories = ["multimedia::video"]
readme = "README.md"
documentation = "https://docs.rs/tpt-kinetix-volumetric"

[dependencies]
tpt-kinetix-core = { path = "../tpt-kinetix-core" }
tpt-kinetix-bitstream = { path = "../tpt-kinetix-bitstream" }
thiserror = "2"
nom = "8"

[dev-dependencies]
tpt-kinetix-test-utils = { path = "../tpt-kinetix-test-utils", version = "0.1.0" }

[lib]
path = "src/lib.rs"
