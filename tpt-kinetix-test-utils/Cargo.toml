[package]
name = "tpt-kinetix-test-utils"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared test helpers for the TPT Kinetix workspace"
keywords = ["tpt-kinetix", "testing", "conformance", "multimedia"]
categories = ["development::testing"]
readme = "README.md"
documentation = "https://docs.rs/tpt-kinetix-test-utils"
publish = false

[dependencies]
tpt-kinetix-core = { workspace = true }
out-kinetix-h264 = { workspace = true }
tpt-kinetix-av1 = { workspace = true }
tpt-kinetix-vp9 = { workspace = true }
tpt-kinetix-realtime = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# DECISION 5 validation harness (loss injector + realtime decoder, no model weights).
realtime-bench = ["tpt-kinetix-realtime"]

[dev-dependencies]
proptest = "1.5"
tpt-kinetix-bitstream = { workspace = true }
tpt-kinetix-demux = { workspace = true }
tpt-kinetix-av1 = { workspace = true }
tpt-kinetix-lean = { workspace = true }
tpt-kinetix-vision = { workspace = true }
tpt-kinetix-screen = { workspace = true }
tpt-kinetix-realtime = { workspace = true }
tpt-kinetix-lossless = { workspace = true }
tpt-kinetix-face = { workspace = true }
tpt-kinetix-volumetric = { workspace = true }
