[package]
name = "tpt-kinetix-stream"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Async streaming output (RTMP push, HLS packaging) for the TPT Kinetix engine"
keywords = ["rtmp", "hls", "streaming", "video", "live"]
categories = ["multimedia", "network-programming"]
readme = "README.md"
documentation = "https://docs.rs/tpt-kinetix-stream"

[features]
# TLS termination for RTMPS ingest (OBS "RTMPS" mode). Off by default so the
# base crate stays dependency-light; enable for deployments that take
# `rtmps://` publishers.
rtmps = ["dep:tokio-rustls", "dep:rustls-pemfile"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# tokio is not in workspace deps because it carries async-runtime weight;
# only streaming crates need it.
tokio = { version = "1.38", features = ["full"] }
bytes = "1.5"
nom = { workspace = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2.2", optional = true }
tpt-kinetix-core = { workspace = true }
tpt-kinetix-demux = { workspace = true }
tpt-kinetix-package = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tpt-kinetix-test-utils = { path = "../tpt-kinetix-test-utils", version = "0.1.0" }
