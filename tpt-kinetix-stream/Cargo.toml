[package]
name = "tpt-kinetix-stream"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Async streaming output (RTMP push, HLS packaging) for the TPT Kinetix engine"
keywords = ["rtmp", "hls", "streaming", "video", "live"]
categories = ["multimedia", "network-programming"]
readme = "README.md"
documentation = "https://docs.rs/tpt-kinetix-stream"

[features]
# TLS termination for RTMPS ingest (OBS "RTMPS" mode). Off by default so the
# base crate stays dependency-light; enable for deployments that take
# `rtmps://` publishers.
rtmps = ["dep:tokio-rustls", "dep:rustls-pemfile"]
# WHIP (WebRTC-HTTP ingest): browsers and OBS publish VP9/AV1 + Opus over WebRTC. Uses the
# sans-I/O `str0m` stack with its pure-Rust crypto (no OpenSSL, no C), so the
# memory-safe story holds. Off by default: it pulls in the WebRTC dependency tree.
whip = ["dep:str0m"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# tokio is not in workspace deps because it carries async-runtime weight;
# only streaming crates need it.
tokio = { version = "1.38", features = ["full"] }
bytes = "1.5"
nom = { workspace = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2.2", optional = true }
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"], optional = true }
tpt-kinetix-core = { workspace = true }
tpt-kinetix-demux = { workspace = true }
tpt-kinetix-package = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
tokio-test = "0.4"
# The TLS ingest test (feature `rtmps`) plays the client side.
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
tpt-kinetix-test-utils = { path = "../tpt-kinetix-test-utils" }
